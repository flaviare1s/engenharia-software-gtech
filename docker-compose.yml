services:
  web:
    container_name: digital-web
    image: nginx:latest
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    networks:
      - digital-network
    depends_on:
      - app

  app:
    container_name: digital-app
    build: ./docker/php
    volumes:
      - .:/var/www
    networks:
      - digital-network

networks:
  digital-network:
    driver: bridge
